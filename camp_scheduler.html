<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامه‌ریز هفتگی اردو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a0e1f; --bg-2: #161238; --bg-3: #2a1256;
    --bg-blob-1: rgba(123,63,228,0.35); --bg-blob-2: rgba(255,122,89,0.18);
    --stars-op: 1;
    --panel: rgba(255,255,255,0.045); --panel-border: rgba(255,255,255,0.09);
    --text-hi: #f5f1ff; --text-lo: rgba(245,241,255,0.62);
    --fire-1: #ffb347; --fire-2: #ff7a59; --fire-3: #d1495b;
    --btn-hover: rgba(255,255,255,0.08);
    --track-bg: rgba(255,255,255,0.02); --track-border: rgba(255,255,255,0.06);
    --grid-line: rgba(255,255,255,0.08);
    --modal-bg: linear-gradient(165deg, #1a1836, #241040); --modal-border: rgba(255,255,255,0.12);
    --input-bg: rgba(255,255,255,0.06); --input-border: rgba(255,255,255,0.14);
    --ghost-border: rgba(255,255,255,0.6); --ghost-bg: rgba(255,255,255,0.12);
    --scrollbar-track: rgba(255,255,255,0.03);
    --input-color-scheme: dark;
    --overlay-bg: rgba(5,6,15,0.72);
    --tip-bg: #1a1836; --tip-border: rgba(255,255,255,0.14); --tip-text: #f5f1ff; --tip-sub: rgba(245,241,255,0.6);
    --badge-edit-bg: rgba(255,179,71,0.16); --badge-edit-border: rgba(255,179,71,0.4); --badge-edit-text: #ffcd8a;
    --badge-view-bg: rgba(140,150,255,0.12); --badge-view-border: rgba(140,150,255,0.3); --badge-view-text: #c9cdff;
  }
  body.theme-light {
    --bg-1: #eaf3ff; --bg-2: #fdf3ea; --bg-3: #fff8ee;
    --bg-blob-1: rgba(255,158,90,0.22); --bg-blob-2: rgba(120,150,255,0.16);
    --stars-op: 0;
    --panel: rgba(30,20,10,0.045); --panel-border: rgba(30,20,60,0.10);
    --text-hi: #241b2e; --text-lo: rgba(36,27,46,0.62);
    --fire-1: #e8720c; --fire-2: #d94f30; --fire-3: #a52f3f;
    --btn-hover: rgba(20,10,40,0.06);
    --track-bg: rgba(20,10,40,0.025); --track-border: rgba(20,10,40,0.08);
    --grid-line: rgba(20,10,40,0.10);
    --modal-bg: linear-gradient(165deg, #ffffff, #fbeee0); --modal-border: rgba(30,20,10,0.12);
    --input-bg: rgba(20,10,40,0.04); --input-border: rgba(20,10,40,0.16);
    --ghost-border: rgba(30,20,10,0.55); --ghost-bg: rgba(30,20,10,0.10);
    --scrollbar-track: rgba(20,10,40,0.05);
    --input-color-scheme: light;
    --overlay-bg: rgba(230,220,235,0.6);
    --tip-bg: #ffffff; --tip-border: rgba(20,10,40,0.12); --tip-text: #241b2e; --tip-sub: rgba(36,27,46,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background:
      radial-gradient(ellipse 120% 60% at 15% -10%, var(--bg-blob-1), transparent 60%),
      radial-gradient(ellipse 100% 50% at 90% 0%, var(--bg-blob-2), transparent 55%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    color: var(--text-hi);
    min-height: 100vh;
    padding: 32px 18px 60px;
    position: relative;
    overflow-x: hidden;
    transition: background .25s ease, color .25s ease;
  }
  body::before {
    content:""; position: fixed; inset:0; pointer-events:none; z-index:0;
    opacity: var(--stars-op);
    transition: opacity .25s ease;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 25% 45%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 65% 30%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 92% 20%, rgba(255,255,255,0.45), transparent);
  }
  .wrap { max-width: 1300px; margin: 0 auto; position: relative; z-index: 1; }
  svg.icon { width:1em; height:1em; display:inline-block; vertical-align:-0.15em; }

  header.hero { text-align: center; margin-bottom: 22px; }
  .toolbar-row { display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom: 16px; flex-wrap:wrap; }
  .toolbar-row .btn { font-size:12.5px; padding: 8px 14px; display:inline-flex; align-items:center; gap:6px; }
  .toolbar-row .btn svg.icon { width:15px; height:15px; }
  .mode-badge {
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    padding: 7px 13px; border-radius: 999px; border:1px solid;
  }
  .mode-badge.view { background: var(--badge-view-bg); border-color: var(--badge-view-border); color: var(--badge-view-text); }
  .mode-badge.edit { background: var(--badge-edit-bg); border-color: var(--badge-edit-border); color: var(--badge-edit-text); }
  .mode-badge svg.icon { width:14px; height:14px; }

  .eyebrow {
    display:inline-flex; align-items:center; gap:7px;
    font-size: 13px; color: var(--text-lo);
    background: var(--panel); border: 1px solid var(--panel-border);
    padding: 6px 16px; border-radius: 999px; margin-bottom: 16px;
  }
  .eyebrow svg.icon { width:15px; height:15px; }
  h1 {
    font-size: clamp(28px, 4.5vw, 46px); font-weight: 900; margin: 0 0 8px;
    background: linear-gradient(90deg, var(--fire-1), var(--fire-2) 55%, var(--fire-3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -0.5px;
  }
  .subtitle { color: var(--text-lo); font-size: 15px; }

  .legend { display:flex; flex-wrap:wrap; justify-content:center; gap: 8px 16px; margin: 16px auto 0; max-width: 900px; }
  .legend-item { display:flex; align-items:center; gap:7px; font-size: 12.5px; color: var(--text-lo); }
  .legend-icon {
    width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    color:#10121c; flex:none;
  }
  .legend-icon svg.icon { width:13px; height:13px; }

  .btn {
    font-family:inherit; cursor:pointer; border:none; border-radius: 10px;
    padding: 9px 16px; font-size: 13.5px; font-weight:700;
    background: var(--panel); color: var(--text-hi); border: 1px solid var(--panel-border);
    transition: transform .1s ease, background .15s ease;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    background: linear-gradient(90deg, var(--fire-1), var(--fire-2));
    color: #1a1006; border:none;
  }
  .btn.danger { background: rgba(220,60,60,0.18); border-color: rgba(220,60,60,0.4); color:#ff9b9b; }
  .btn[disabled] { opacity:0.4; cursor:not-allowed; }

  .schedule-panel {
    margin-top: 10px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 22px; padding: 18px; backdrop-filter: blur(6px);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.35);
  }
  .schedule-shell { display:flex; gap: 10px; align-items: flex-start; }

  .labels-col { flex: none; width: 128px; display:flex; flex-direction:column; }
  .ruler-spacer { height: 46px; margin-bottom: 10px; }
  .day-row-label {
    display:flex; flex-direction:column; justify-content:center; margin-top: 10px;
    min-height: 96px;
  }
  .labels-col .day-row-label:first-child { margin-top: 0; }
  .day-weekday { font-size: 16px; font-weight: 800; }
  .day-date {
    font-size: 13px; font-weight: 700; margin-top: 2px;
    background: linear-gradient(90deg, var(--fire-1), var(--fire-2));
    -webkit-background-clip: text; background-clip:text; color:transparent;
  }
  .day-greg { font-size: 10.5px; color: var(--text-lo); margin-top: 2px; }
  .add-ev-btn {
    margin-top: 8px; font-size: 11px; padding: 4px 8px; border-radius: 8px;
    align-self: flex-start;
  }

  .scroll-area { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; border-radius: 16px; }
  .scroll-area::-webkit-scrollbar { height: 10px; }
  .scroll-area::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 10px; }
  .scroll-area::-webkit-scrollbar-thumb { background: linear-gradient(90deg, var(--fire-2), var(--fire-1)); border-radius: 10px; }

  .grid-inner { position: relative; }

  /* ruler: always a plain light surface with faint sun/moon watermarks, per explicit request */
  .ruler {
    position: relative; height: 46px; margin-bottom: 10px; border-radius: 12px;
    background: #f4f1ea; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(20,15,10,0.10);
  }
  .ruler-wm { position:absolute; top:50%; transform:translateY(-50%); opacity:0.16; color:#7a6a4a; pointer-events:none; }
  .ruler-wm svg { width:26px; height:26px; }
  .hour-tick { position:absolute; top:0; bottom:0; border-right: 1px solid rgba(20,15,10,0.14); display:flex; align-items:flex-end; justify-content:flex-end; padding-bottom: 4px; }
  .hour-tick span { font-size: 11px; font-weight: 700; color: #4a4034; padding-right: 4px; white-space: nowrap; }

  .day-track {
    position: relative; margin-top: 10px;
    background: var(--track-bg); border: 1px solid var(--track-border); border-radius: 12px;
    user-select: none;
  }
  body.mode-edit .day-track { cursor: crosshair; }
  .grid-inner > .day-track:first-of-type { margin-top: 0; }
  .grid-lines { position:absolute; inset:0; border-radius: 12px; overflow:hidden; pointer-events:none; }
  .gline { position:absolute; top:0; bottom:0; border-right: 1px dashed var(--grid-line); }

  .ev-block {
    position:absolute; border-radius: 10px; padding: 1px;
    box-shadow: 0 4px 14px -6px rgba(0,0,0,0.5);
  }
  body.mode-edit .ev-block { cursor: grab; }
  body.mode-view .ev-block { cursor: pointer; }
  .ev-block.dragging { cursor: grabbing; z-index: 50; box-shadow: 0 10px 26px -8px rgba(0,0,0,0.7); opacity: 0.95; }
  .ev-inner {
    height:100%; width:100%; border-radius: 9px; padding: 6px 9px;
    display:flex; flex-direction:column; gap:1px; overflow:hidden; position:relative; color:#10121c;
  }
  .ev-top { display:flex; align-items:center; gap:6px; min-width:0; }
  .ev-ico { flex:none; width:15px; height:15px; display:flex; align-items:center; justify-content:center; }
  .ev-ico svg { width:15px; height:15px; }
  .ev-title { font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
  .ev-time { font-size: 10.5px; font-weight: 700; color: rgba(16,18,28,0.72); }
  .ev-desc { font-size: 10.5px; color: rgba(16,18,28,0.78); line-height:1.4; overflow:hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .ev-narrow .ev-desc, .ev-narrow .ev-time { display:none; }
  .ev-narrow .ev-title { font-size: 11px; }
  .ev-icononly .ev-title, .ev-icononly .ev-time, .ev-icononly .ev-desc { display:none; }
  .ev-icononly .ev-top { justify-content:center; height:100%; }
  .ev-icononly .ev-ico { width:18px; height:18px; }
  .ev-icononly .ev-ico svg { width:18px; height:18px; }

  .resize-handle { position:absolute; top:0; bottom:0; width: 10px; cursor: ew-resize; z-index: 5; }
  .resize-handle.left { left: 0; }
  .resize-handle.right { right: 0; }
  .resize-handle::after {
    content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:3px; height:16px; border-radius:2px; background: rgba(0,0,0,0.25);
  }
  body.mode-view .resize-handle { display:none; }

  .ghost-block { position:absolute; border-radius: 10px; border: 2px dashed var(--ghost-border); background: var(--ghost-bg); pointer-events:none; z-index: 40; }

  /* hover tooltip */
  .hover-tip {
    position: fixed; z-index: 200; max-width: 260px;
    background: var(--tip-bg); border: 1px solid var(--tip-border); color: var(--tip-text);
    border-radius: 12px; padding: 10px 13px; box-shadow: 0 20px 50px -15px rgba(0,0,0,0.4);
    pointer-events: none; opacity: 0; transition: opacity .12s ease; font-size: 12.5px;
  }
  .hover-tip.show { opacity: 1; }
  .hover-tip .htp-title { font-weight:800; font-size:13.5px; display:flex; align-items:center; gap:7px; margin-bottom:4px; }
  .hover-tip .htp-title svg { width:15px; height:15px; flex:none; }
  .hover-tip .htp-time { color: var(--tip-sub); font-weight:700; margin-bottom:4px; }
  .hover-tip .htp-desc { color: var(--tip-sub); line-height:1.5; }

  /* modal (edit / create) */
  .modal-overlay {
    position: fixed; inset:0; background: var(--overlay-bg); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; z-index: 100; padding: 20px;
  }
  .modal-overlay.hidden { display:none; }
  .modal-card {
    width: 100%; max-width: 420px;
    background: var(--modal-bg);
    border: 1px solid var(--modal-border); border-radius: 18px;
    padding: 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5);
  }
  .modal-title { font-size: 17px; font-weight: 800; margin: 0 0 16px; display:flex; align-items:center; gap:8px; color: var(--text-hi); }
  .modal-title svg { width:19px; height:19px; }
  .field { margin-bottom: 13px; }
  .field label { display:block; font-size: 12.5px; color: var(--text-lo); margin-bottom: 5px; font-weight:600; }
  .field input[type="text"], .field input[type="password"], .field textarea, .field select {
    width:100%; font-family:inherit; font-size: 13.5px; color: var(--text-hi);
    background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 9px; padding: 9px 11px; outline:none;
  }
  .field input[type="time"] {
    font-family:inherit; font-size: 13.5px; color: var(--text-hi);
    background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 9px; padding: 8px 10px; outline:none; direction:ltr;
    width: 100%; color-scheme: var(--input-color-scheme);
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .row-2 { display:flex; gap: 10px; }
  .row-2 > div { flex:1; }
  .field select option { background: #241040; color: #f5f1ff; }
  body.theme-light .field select option { background: #ffffff; color: #241b2e; }
  .modal-actions { display:flex; justify-content:space-between; gap:10px; margin-top: 18px; }
  .modal-actions .left-actions, .modal-actions .right-actions { display:flex; gap:8px; }
  .field-error { font-size:11.5px; color:#e05353; margin-top:4px; display:none; }

  /* view (read-only) modal */
  .view-row { display:flex; align-items:flex-start; gap:10px; margin-bottom: 12px; }
  .view-row .vlabel { font-size: 12px; color: var(--text-lo); font-weight:600; min-width: 64px; flex:none; padding-top:1px; }
  .view-row .vval { font-size: 14px; color: var(--text-hi); font-weight:600; }
  .view-cat-pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:700; color:#10121c; }
  .view-cat-pill svg { width:13px; height:13px; }
  .view-desc { font-size:13.5px; line-height:1.7; color: var(--text-hi); white-space:pre-wrap; }

  footer { text-align:center; margin-top: 22px; font-size: 11.5px; color: var(--text-lo); }

  @media (max-width: 700px) {
    body { padding: 20px 8px 40px; }
    .schedule-panel { padding: 12px; }
    .labels-col { width: 92px; }
    .day-weekday { font-size: 13px; }
    .day-date { font-size: 11.5px; }
    .add-ev-btn { font-size: 10px; padding:3px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="toolbar-row">
      <button class="btn" id="editToggleBtn"></button>
      <button class="btn" id="themeToggle"></button>
      <button class="btn" id="exportBtn"></button>
      <button class="btn" id="importBtn" style="display:none"></button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <span class="mode-badge" id="modeBadge"></span>
    </div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>برنامه هفتگی اردو</h1>
    <div class="subtitle">شنبه ۲۸ تا سه‌شنبه ۳۱ شهریور ۱۴۰۵ &nbsp;·&nbsp; <span dir="ltr">۱۹ تا ۲۲ سپتامبر ۲۰۲۶</span></div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="schedule-panel">
    <div class="schedule-shell">
      <div class="labels-col" id="labelsCol"></div>
      <div class="scroll-area" id="scrollArea">
        <div class="grid-inner" id="gridInner">
          <div class="ruler" id="ruler"></div>
          <div id="tracksHost"></div>
        </div>
      </div>
    </div>
  </div>
  <footer id="pageFooter"></footer>
</div>

<div class="hover-tip" id="hoverTip"></div>

<!-- edit / create modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-title" id="modalTitleWrap"><span id="modalIconWrap"></span><span id="modalHeading">جزئیات رویداد</span></div>
    <div class="field">
      <label>عنوان</label>
      <input type="text" id="fTitle" placeholder="مثلاً: کارگاه طناب‌کشی" />
      <div class="field-error" id="titleError">لطفاً یک عنوان وارد کن.</div>
    </div>
    <div class="field">
      <label>توضیحات (اختیاری)</label>
      <textarea id="fDesc" placeholder="جزئیات بیشتر..."></textarea>
    </div>
    <div class="field">
      <label>نوع برنامه</label>
      <select id="fCategory"></select>
    </div>
    <div class="field">
      <label>روز</label>
      <select id="fDay"></select>
    </div>
    <div class="row-2">
      <div class="field">
        <label>ساعت شروع</label>
        <input type="time" id="fStart" step="300" />
      </div>
      <div class="field">
        <label>ساعت پایان</label>
        <input type="time" id="fEnd" step="300" />
      </div>
    </div>
    <div class="field-error" id="timeError">ساعت پایان باید بعد از ساعت شروع باشد.</div>
    <div class="modal-actions">
      <div class="left-actions"><button class="btn danger" id="btnDelete">حذف</button></div>
      <div class="right-actions">
        <button class="btn" id="btnCancel">انصراف</button>
        <button class="btn primary" id="btnSave">ذخیره</button>
      </div>
    </div>
  </div>
</div>

<!-- read-only view modal -->
<div class="modal-overlay hidden" id="viewModalOverlay">
  <div class="modal-card">
    <div class="modal-title" id="viewTitleWrap"><span id="viewIconWrap"></span><span id="viewHeadingText"></span></div>
    <div class="view-row"><div class="vlabel">نوع</div><div class="vval"><span class="view-cat-pill" id="viewCatPill"></span></div></div>
    <div class="view-row"><div class="vlabel">روز</div><div class="vval" id="viewDay"></div></div>
    <div class="view-row"><div class="vlabel">ساعت</div><div class="vval" id="viewTime" dir="ltr" style="text-align:right"></div></div>
    <div class="view-row" id="viewDescRow"><div class="vlabel">توضیحات</div><div class="view-desc" id="viewDesc"></div></div>
    <div class="modal-actions" style="justify-content:flex-end;">
      <button class="btn primary" id="viewCloseBtn">بستن</button>
    </div>
  </div>
</div>

<!-- password modal -->
<div class="modal-overlay hidden" id="pwModalOverlay">
  <div class="modal-card" style="max-width:340px;">
    <div class="modal-title" id="pwModalTitleWrap"><span id="pwModalIconWrap"></span><span>ورود به حالت ویرایش</span></div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="pwInput" placeholder="رمز را وارد کن" />
      <div class="field-error" id="pwError">رمز اشتباه است.</div>
    </div>
    <div class="modal-actions">
      <div class="left-actions"></div>
      <div class="right-actions">
        <button class="btn" id="pwCancel">انصراف</button>
        <button class="btn primary" id="pwSubmit">ورود</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     رمز ویرایش: این مقدار را می‌توانی به دلخواه تغییر بدی.
     توجه: چون این یک برنامه‌ی سمت-کاربر (client-side) است،
     این رمز فقط از ویرایش‌های تصادفیِ بازدیدکننده‌های عادی
     جلوگیری می‌کند و یک قفل امنیتیِ واقعی محسوب نمی‌شود.
     ========================================================= */
  var EDIT_PASSWORD = 'kharazi1405';

  /* ---------- config ---------- */
  var HOUR_PX = 76;
  var RANGE_START = 0;

    return '<div class="ev-block'+sizeClass+'" data-id="'+ev.id+'" '+
      'style="left:'+left+'px;width:'+width+'px;top:'+top+'px;height:'+LANE_H+'px;">'+
      '<div class="ev-inner" style="background:linear-gradient(135deg,'+cat.c1+','+cat.c2+')">'+
        '<div class="ev-top"><span class="ev-ico">'+cat.icon+'</span><span class="ev-title">'+escapeHtml(ev.title)+'</span></div>'+
        '<div class="ev-time" dir="ltr">'+mixedTime(ev.start)+' – '+mixedTime(ev.end)+'</div>'+
        descHtml + resizeHandles +
      '</div>'+
    '</div>';
  }

  function renderAll(){ renderRuler(); renderLabelsAndTracks(); }

  /* ---------- hover tooltip ---------- */
  var hoverTip = document.getElementById('hoverTip');
  var hoverTimer = null;
  function dayLabelFor(key){ var d = DAYS.find(function(x){return x.key===key;}); return d ? (d.weekday+' ('+d.fdate+')') : ''; }

  function showTip(ev, clientX, clientY){
    var cat = CATS[ev.category] || CATS[DEFAULT_CAT];
    var html = '<div class="htp-title">'+cat.icon+'<span>'+escapeHtml(ev.title)+'</span></div>'+
      '<div class="htp-time">'+dayLabelFor(ev.day)+' · <span dir="ltr">'+mixedTime(ev.start)+' – '+mixedTime(ev.end)+'</span></div>'+
      (ev.description ? '<div class="htp-desc">'+escapeHtml(ev.description)+'</div>' : '');
    hoverTip.innerHTML = html;
    positionTip(clientX, clientY);
    hoverTip.classList.add('show');
  }
  function positionTip(clientX, clientY){
    var pad = 14;
    var rect = hoverTip.getBoundingClientRect();
    var x = clientX - rect.width/2;
    var y = clientY - rect.height - pad;
    if (y < 6) y = clientY + pad;
    x = Math.max(6, Math.min(window.innerWidth-rect.width-6, x));
    hoverTip.style.left = x+'px'; hoverTip.style.top = y+'px';
  }
  function hideTip(){ hoverTip.classList.remove('show'); }

  tracksHost.addEventListener('pointerenter', function(e){
    var block = e.target.closest && e.target.closest('.ev-block');
    if (!block) return;
    var ev = state.events.find(function(x){return x.id===block.getAttribute('data-id');});
    if (!ev) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(function(){ showTip(ev, e.clientX, e.clientY); }, 180);
  }, true);
  tracksHost.addEventListener('pointermove', function(e){
    if (!hoverTip.classList.contains('show')) return;
    var block = e.target.closest && e.target.closest('.ev-block');
    if (!block){ hideTip(); return; }
    positionTip(e.clientX, e.clientY);
  });
  tracksHost.addEventListener('pointerleave', function(e){
    var block = e.target.closest && e.target.closest('.ev-block');
    if (!block){ clearTimeout(hoverTimer); hideTip(); }
  }, true);
  tracksHost.addEventListener('pointerdown', function(){ clearTimeout(hoverTimer); hideTip(); });

  /* ---------- edit modal ---------- */
  var overlay = document.getElementById('modalOverlay');
  var fTitle = document.getElementById('fTitle');
  var fDesc = document.getElementById('fDesc');
  var fCategory = document.getElementById('fCategory');
  var fDay = document.getElementById('fDay');
  var fStart = document.getElementById('fStart');
  var fEnd = document.getElementById('fEnd');
  var titleError = document.getElementById('titleError');
  var timeError = document.getElementById('timeError');
  var btnDelete = document.getElementById('btnDelete');
  var btnCancel = document.getElementById('btnCancel');
  var btnSave = document.getElementById('btnSave');
  var modalHeading = document.getElementById('modalHeading');
  var modalIconWrap = document.getElementById('modalIconWrap');
  var editingId = null;

  function populateSelects(){
    fCategory.innerHTML = CAT_ORDER.map(function(k){ return '<option value="'+k+'">'+CATS[k].label+'</option>'; }).join('');
    fDay.innerHTML = DAYS.map(function(d){ return '<option value="'+d.key+'">'+d.weekday+' ('+d.fdate+')</option>'; }).join('');
  }

  function openModalForEdit(ev){
    hideTip();
    editingId = ev.id;
    modalIconWrap.innerHTML = ICONS.pencil;
    modalHeading.textContent = 'ویرایش رویداد';
    fTitle.value = ev.title; fDesc.value = ev.description||'';
    fCategory.value = ev.category; fDay.value = ev.day;
    fStart.value = minToHHMM(ev.start); fEnd.value = minToHHMM(ev.end);
    btnDelete.style.display=''; hideErrors();
    overlay.classList.remove('hidden');
  }
  function openModalForCreate(day, startMin, endMin){
    hideTip();
    editingId = null;
    modalIconWrap.innerHTML = ICONS.plusCircle;
    modalHeading.textContent = 'رویداد جدید';
    fTitle.value=''; fDesc.value=''; fCategory.value=DEFAULT_CAT; fDay.value=day;
    fStart.value = minToHHMM(startMin); fEnd.value = minToHHMM(endMin);
    btnDelete.style.display='none'; hideErrors();
    overlay.classList.remove('hidden');
    setTimeout(function(){ fTitle.focus(); }, 30);
  }
  function closeModal(){ overlay.classList.add('hidden'); editingId=null; }
  function hideErrors(){ titleError.style.display='none'; timeError.style.display='none'; }
  btnCancel.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if (e.target===overlay) closeModal(); });

  btnSave.addEventListener('click', function(){
    hideErrors();
    var title = fTitle.value.trim();
    if (!title){ titleError.style.display='block'; return; }
    var s = snap(hhmmToMin(fStart.value));
    var eMin = snap(hhmmToMin(fEnd.value));
    if (eMin - s < MIN_DUR){ timeError.style.display='block'; return; }
    if (editingId){
      var ev = state.events.find(function(x){return x.id===editingId;});
      if (ev){ ev.title=title; ev.description=fDesc.value.trim(); ev.category=fCategory.value; ev.day=fDay.value; ev.start=s; ev.end=eMin; }
    } else {
      state.events.push({ id:uid(), day:fDay.value, start:s, end:eMin, title:title, description:fDesc.value.trim(), category:fCategory.value });
    }
    persist(); renderAll(); closeModal();
  });
  btnDelete.addEventListener('click', function(){
    if (editingId){ state.events = state.events.filter(function(x){return x.id!==editingId;}); persist(); renderAll(); }
    closeModal();
  });

  /* ---------- read-only view modal ---------- */
  var viewOverlay = document.getElementById('viewModalOverlay');
  var viewHeadingText = document.getElementById('viewHeadingText');
  var viewIconWrap = document.getElementById('viewIconWrap');
  var viewCatPill = document.getElementById('viewCatPill');
  var viewDay = document.getElementById('viewDay');
  var viewTime = document.getElementById('viewTime');
  var viewDescRow = document.getElementById('viewDescRow');
  var viewDesc = document.getElementById('viewDesc');

  function openViewModal(ev){
    hideTip();
    var cat = CATS[ev.category] || CATS[DEFAULT_CAT];
    viewIconWrap.innerHTML = ICONS.eye;
    viewHeadingText.textContent = ev.title;
    viewCatPill.style.background = 'linear-gradient(135deg,'+cat.c1+','+cat.c2+')';
    viewCatPill.innerHTML = cat.icon + '<span>'+cat.label+'</span>';
    viewDay.textContent = dayLabelFor(ev.day);
    viewTime.textContent = mixedTime(ev.start) + ' – ' + mixedTime(ev.end);
    if (ev.description){ viewDescRow.style.display=''; viewDesc.textContent = ev.description; }
    else { viewDescRow.style.display='none'; }
    viewOverlay.classList.remove('hidden');
  }
  document.getElementById('viewCloseBtn').addEventListener('click', function(){ viewOverlay.classList.add('hidden'); });
  viewOverlay.addEventListener('click', function(e){ if (e.target===viewOverlay) viewOverlay.classList.add('hidden'); });

  /* ---------- pointer interactions ---------- */
  var CLICK_THRESHOLD = 4;
  var drag = null;
  var ghostEl = null;
  function ensureGhost(track){ removeGhost(); ghostEl=document.createElement('div'); ghostEl.className='ghost-block'; ghostEl.style.top=TRACK_PAD+'px'; ghostEl.style.height=LANE_H+'px'; track.appendChild(ghostEl); }
  function updateGhost(s,e){ if(!ghostEl) return; ghostEl.style.left=leftForRange(s,e)+'px'; ghostEl.style.width=Math.max(widthForRange(s,e),10)+'px'; }
  function removeGhost(){ if (ghostEl && ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl); ghostEl=null; }

  tracksHost.addEventListener('pointerdown', function(e){
    var block = e.target.closest('.ev-block');
    var track = e.target.closest('.day-track');
    if (!track) return;

    if (!isEditMode){
      if (block){
        var vev = state.events.find(function(x){return x.id===block.getAttribute('data-id');});
        if (vev) openViewModal(vev);
      }
      return;
    }

    var handle = e.target.closest('.resize-handle');
    if (handle){
      var id = handle.getAttribute('data-id');
      var ev = state.events.find(function(x){return x.id===id;});
      if (!ev) return;
      drag = { mode:handle.getAttribute('data-role'), id:id, trackEl:track, startClientX:e.clientX, origStart:ev.start, origEnd:ev.end, moved:false };
      e.preventDefault(); return;
    }
    if (block){
      var bid = block.getAttribute('data-id');
      var bev = state.events.find(function(x){return x.id===bid;});
      if (!bev) return;
      drag = { mode:'move', id:bid, trackEl:track, startClientX:e.clientX, origStart:bev.start, origEnd:bev.end, moved:false, el:block };
      e.preventDefault(); return;
    }
    var rect = track.getBoundingClientRect();
    var anchorMin = snap(clientXToMin(e.clientX, rect));
    anchorMin = Math.max(RANGE_START, Math.min(RANGE_END-MIN_DUR, anchorMin));
    drag = { mode:'create', dayKey:track.getAttribute('data-day'), trackEl:track, startClientX:e.clientX, anchorMin:anchorMin, moved:false };
    ensureGhost(track); updateGhost(anchorMin, anchorMin+MIN_DUR);
    e.preventDefault();
  });

  window.addEventListener('pointermove', function(e){
    if (!drag) return;
    var deltaPx = e.clientX - drag.startClientX;
    if (Math.abs(deltaPx) > CLICK_THRESHOLD) drag.moved = true;
    var deltaMin = -deltaPx/HOUR_PX*60;

    if (drag.mode==='move'){
      var dur = drag.origEnd-drag.origStart;
      var newStart = snap(drag.origStart+deltaMin);
      newStart = Math.max(RANGE_START, Math.min(RANGE_END-dur, newStart));
      var newEnd = newStart+dur;
      if (drag.el){ drag.el.classList.add('dragging'); drag.el.style.left = leftForRange(newStart,newEnd)+'px'; }
      drag._liveStart=newStart; drag._liveEnd=newEnd;
    } else if (drag.mode==='resize-start'){
      var newS = snap(drag.origStart+deltaMin);
      newS = Math.max(RANGE_START, Math.min(drag.origEnd-MIN_DUR, newS));
      var b = tracksHost.querySelector('.ev-block[data-id="'+drag.id+'"]');
      if (b) b.style.width = Math.max(widthForRange(newS, drag.origEnd),24)+'px';
      drag._liveStart=newS; drag._liveEnd=drag.origEnd;
    } else if (drag.mode==='resize-end'){
      var newE = snap(drag.origEnd+deltaMin);
      newE = Math.min(RANGE_END, Math.max(drag.origStart+MIN_DUR, newE));
      var b2 = tracksHost.querySelector('.ev-block[data-id="'+drag.id+'"]');
      if (b2){ b2.style.left = leftForRange(drag.origStart,newE)+'px'; b2.style.width = Math.max(widthForRange(drag.origStart,newE),24)+'px'; }
      drag._liveStart=drag.origStart; drag._liveEnd=newE;
    } else if (drag.mode==='create'){
      var rect = drag.trackEl.getBoundingClientRect();
      var curMin = snap(clientXToMin(e.clientX, rect));
      curMin = Math.max(RANGE_START, Math.min(RANGE_END, curMin));
      var s2=Math.min(drag.anchorMin,curMin), e2=Math.max(drag.anchorMin,curMin);
      if (e2-s2<MIN_DUR) e2=s2+MIN_DUR;
      updateGhost(s2,e2); drag._liveStart=s2; drag._liveEnd=e2;
    }
  });

  window.addEventListener('pointerup', function(){
    if (!drag) return;
    var d = drag; drag = null;
    if (d.mode==='move'||d.mode==='resize-start'||d.mode==='resize-end'){
      if (d.el) d.el.classList.remove('dragging');
      if (!d.moved){
        var ev = state.events.find(function(x){return x.id===d.id;});
        renderAll();
        if (ev) openModalForEdit(ev);
        return;
      }
      var ev2 = state.events.find(function(x){return x.id===d.id;});
      if (ev2 && d._liveStart!=null){ ev2.start=d._liveStart; ev2.end=d._liveEnd; persist(); }
      renderAll();
      return;
    }
    if (d.mode==='create'){
      removeGhost();
      var s = d._liveStart!=null ? d._liveStart : d.anchorMin;
      var eMin = d._liveEnd!=null ? d._liveEnd : d.anchorMin+30;
      if (!d.moved) eMin = s+30;
      openModalForCreate(d.dayKey, s, eMin);
    }
  });

  labelsCol.addEventListener('click', function(e){
    var btn = e.target.closest('[data-add-day]');
    if (!btn || !isEditMode) return;
    openModalForCreate(btn.getAttribute('data-add-day'), 9*60, 10*60);
  });

  /* ---------- static button labels ---------- */
  document.getElementById('exportBtn').innerHTML = ICONS.download + '<span>خروجی</span>';
  document.getElementById('importBtn').innerHTML = ICONS.upload + '<span>ورودی</span>';

  /* ---------- init ---------- */
  populateSelects();
  renderLegend();
  renderModeUI();
  loadTheme(applyTheme);
  loadState(function(){ renderAll(); });

})();
</script>
</body>
</html>
